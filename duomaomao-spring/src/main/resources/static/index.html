<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>躲猫猫探头导出</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1f232c;
    --line: #2a2f3a;
    --text: #e6e8ee;
    --dim: #98a0b3;
    --accent: #4c8dff;
    --ok: #35c07a;
    --warn: #e0a13a;
    --bad: #e5534b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  header {
    padding: 18px 24px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .sub { color: var(--dim); font-size: 12px; }
  main { padding: 20px 24px 60px; max-width: 1240px; margin: 0 auto; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px; margin-bottom: 16px;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { filter: brightness(1.1); }
  input[type=search], select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font-size: 14px;
  }
  input[type=search] { width: 260px; }
  .bar { height: 8px; background: var(--panel-2); border-radius: 999px; overflow: hidden; margin: 12px 0 8px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }
  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 6px 18px; font-size: 13px; }
  .kv > div { min-width: 0; overflow-wrap: anywhere; }
  .kv > div.wide { grid-column: 1 / -1; }
  .kv b { color: var(--dim); font-weight: 500; }
  .state-RUNNING { color: var(--accent); }
  .state-DONE { color: var(--ok); }
  .state-FAILED { color: var(--bad); }
  .state-IDLE { color: var(--dim); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 500; position: sticky; top: 0; background: var(--panel); }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--panel-2); }
  td.num { color: var(--dim); font-variant-numeric: tabular-nums; }
  .tag {
    display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 12px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--dim);
  }
  .tag.hot { color: var(--warn); border-color: #4a3a1c; }
  .pager { display: flex; gap: 10px; align-items: center; justify-content: flex-end; margin-top: 12px; color: var(--dim); }
  .empty { color: var(--dim); padding: 24px; text-align: center; }
  /* 详情 */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: none; align-items: center; justify-content: center; padding: 24px; z-index: 10;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    width: min(760px, 100%); max-height: 84vh; display: flex; flex-direction: column;
  }
  .modal header { border-bottom: 1px solid var(--line); padding: 14px 18px; }
  .modal .body { padding: 16px 18px; overflow: auto; }
  .modal .body h3 { margin: 0 0 6px; font-size: 15px; }
  .meta { color: var(--dim); font-size: 12px; margin-bottom: 14px; }
  .comment { border-left: 2px solid var(--line); padding: 6px 0 6px 12px; margin-bottom: 10px; }
  .comment .who { color: var(--dim); font-size: 12px; }
  .comment .when { color: var(--dim); font-size: 12px; margin-left: 8px; }
  .warn { color: var(--warn); font-size: 13px; }
  .err { color: var(--bad); font-size: 13px; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>躲猫猫 · 探头数据导出</h1>
  <span class="sub">抓取全量探头 + 留言详情，落盘成固定 JSON 文件</span>
  <a class="sub" href="/route.html" style="margin-left:auto;color:#4c8dff;text-decoration:none">路线规划测试 →</a>
</header>

<main>
  <section class="card">
    <div class="row">
      <button class="primary" id="btn-start">开始抓取（全量 + 详情）</button>
      <button id="btn-fast">只抓列表（不抓详情）</button>
      <button id="btn-probe">试跑 50 条</button>
      <button id="btn-download" disabled>下载 JSON</button>
      <span class="sub" id="hint">全量约 7300 条探头，会发约 7300 次详情请求（默认 6 并发），大概几分钟。</span>
    </div>

    <div class="bar"><i id="progress"></i></div>

    <div class="kv">
      <div><b>状态</b> <span id="state" class="state-IDLE">IDLE</span></div>
      <div><b>进度</b> <span id="counts">-</span></div>
      <div><b>详情失败</b> <span id="failed">0</span></div>
      <div><b>耗时</b> <span id="elapsed">-</span></div>
      <div class="wide"><b>文件</b> <span id="file" class="sub">-</span></div>
      <div><b>生成时间</b> <span id="generated" class="sub">-</span></div>
    </div>
    <div id="message" class="sub" style="margin-top:8px">尚未导出</div>
    <div id="error" class="err"></div>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between">
      <div class="row">
        <input type="search" id="q" placeholder="搜索 id / 名称 / href">
        <select id="size">
          <option value="20">20 条/页</option>
          <option value="50" selected>50 条/页</option>
          <option value="100">100 条/页</option>
          <option value="200">200 条/页</option>
        </select>
      </div>
      <div class="sub" id="matched"></div>
    </div>

    <div style="overflow:auto; max-height: 60vh; margin-top: 12px">
      <table>
        <thead>
        <tr>
          <th style="width:70px">id</th>
          <th>名称</th>
          <th style="width:200px">坐标（经度, 纬度）</th>
          <th style="width:70px">类型</th>
          <th style="width:100px">建档</th>
          <th style="width:80px">留言</th>
        </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty">还没有数据。点上面的「开始抓取」。</div>
    </div>

    <div class="pager">
      <button id="prev">上一页</button>
      <span id="pageinfo">1 / 1</span>
      <button id="next">下一页</button>
    </div>
  </section>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <header class="row" style="justify-content:space-between">
      <strong id="detail-title">详情</strong>
      <button id="close">关闭</button>
    </header>
    <div class="body" id="detail-body"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v == null ? "" : v)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

let page = 1;
let matched = 0;
let polling = null;

async function api(path, options) {
  const res = await fetch(path, options);
  const text = await res.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch (e) { body = { detail: text }; }
  if (!res.ok) {
    const msg = (body && (body.detail || body.message)) || ("HTTP " + res.status);
    throw new Error(msg);
  }
  return body;
}

// ---------------------------------------------------------------- 状态
async function refreshStatus() {
  let s;
  try { s = await api("/api/v1/export/status"); }
  catch (e) { $("message").textContent = "状态接口不可用：" + e.message; return; }

  $("state").textContent = s.state;
  $("state").className = "state-" + s.state;
  $("counts").textContent = s.total > 0 ? `${s.done} / ${s.total}（${s.percent}%）` : "-";
  $("failed").textContent = s.failed;
  $("elapsed").textContent = s.durationMs == null ? "-" : fmtMs(s.durationMs);
  $("file").textContent = s.file || "-";
  $("message").textContent = s.message || "";
  $("error").textContent = s.error || "";
  $("progress").style.width = (s.total > 0 ? s.percent : (s.state === "DONE" ? 100 : 0)) + "%";
  $("btn-download").disabled = !s.sizeBytes;

  const busy = s.state === "RUNNING";
  $("btn-start").disabled = busy;
  $("btn-fast").disabled = busy;
  $("btn-probe").disabled = busy;

  if (busy && !polling) {
    polling = setInterval(refreshStatus, 1000);
  } else if (!busy && polling) {
    clearInterval(polling);
    polling = null;
    await loadPreview(1);
  }
  return s;
}

function fmtMs(ms) {
  if (ms == null) return "-";
  if (ms < 1000) return ms + " ms";
  const s = Math.round(ms / 1000);
  return s < 60 ? s + " s" : Math.floor(s / 60) + " 分 " + (s % 60) + " 秒";
}

/** ISO-8601 → 2026-10-29 09:54:39（保留到秒，别把 +08:00 折成两行） */
function fmtTime(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} `
    + `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

// ---------------------------------------------------------------- 列表
async function loadPreview(targetPage) {
  const q = $("q").value.trim();
  const size = $("size").value;
  const url = `/api/v1/export/preview?page=${targetPage}&size=${size}` + (q ? "&q=" + encodeURIComponent(q) : "");
  let data;
  try { data = await api(url); }
  catch (e) {
    $("tbody").innerHTML = "";
    $("empty").style.display = "block";
    $("empty").textContent = e.message;
    $("matched").textContent = "";
    return;
  }

  page = data.page;
  matched = data.matched;
  $("generated").textContent = fmtTime(data.generatedAt);
  $("matched").textContent = `共 ${data.matched} 条` + (q ? `（关键字：${q}）` : "");

  const rows = data.items.map((c) => {
    const pos = Array.isArray(c.position) && c.position.length >= 2
      ? `${c.position[0].toFixed(5)}, ${c.position[1].toFixed(5)}` : "-";
    const count = c.detailError
      ? `<span class="tag hot" title="${esc(c.detailError)}">失败</span>`
      : `<span class="tag${c.commentCount > 0 ? " hot" : ""}">${c.commentCount}</span>`;
    return `<tr data-id="${c.id}">
      <td class="num">${c.id}</td>
      <td>${esc(c.name)}${c.detailError ? ' <span class="warn">· 详情失败</span>' : ""}</td>
      <td class="num">${esc(pos)}</td>
      <td class="num">${esc(c.aa || "-")}</td>
      <td class="num">${esc(c.time || "-")}</td>
      <td>${count}</td>
    </tr>`;
  }).join("");

  $("tbody").innerHTML = rows;
  $("empty").style.display = rows ? "none" : "block";
  if (!rows) $("empty").textContent = "没有匹配的探头";

  const pages = Math.max(1, Math.ceil(matched / Number(size)));
  $("pageinfo").textContent = `${page} / ${pages}`;
  $("prev").disabled = page <= 1;
  $("next").disabled = page >= pages;
}

// ---------------------------------------------------------------- 详情
async function openDetail(id) {
  $("overlay").classList.add("open");
  $("detail-title").textContent = "探头 #" + id;
  $("detail-body").innerHTML = '<div class="sub">加载中…</div>';
  let c;
  try { c = await api("/api/v1/export/cameras/" + id); }
  catch (e) { $("detail-body").innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }

  const pos = Array.isArray(c.position) ? c.position.join(", ") : "-";
  const comments = (c.comments || []).map((x) => `
    <div class="comment">
      <div><span class="who">${esc(x.nickname || "匿名")}</span><span class="when">${esc(x.time || "")}</span></div>
      <div>${esc(x.content)}</div>
    </div>`).join("") || '<div class="sub">没有留言</div>';

  $("detail-body").innerHTML = `
    <h3>${esc(c.name)}</h3>
    <div class="meta">
      id ${c.id} · 坐标 [${esc(pos)}] · 类型 ${esc(c.aa || "-")} · 建档 ${esc(c.time || "-")}<br>
      ${c.href ? "来源 " + esc(c.href) : ""}
    </div>
    ${c.cameraName ? `<div class="meta">详情接口名称：${esc(c.cameraName)}（建档 ${esc(c.creatTime || "-")}）</div>` : ""}
    ${c.detailError ? `<div class="err">详情抓取失败：${esc(c.detailError)}</div>` : ""}
    <div>${comments}</div>`;
}

// ---------------------------------------------------------------- 事件
$("btn-start").onclick = () => startExport("", "全量");
$("btn-fast").onclick = () => startExport("&detail=false", "仅列表");
$("btn-probe").onclick = () => startExport("&limit=50", "试跑 50 条");

async function startExport(extra, label) {
  try {
    await api("/api/v1/export/start" + (extra ? "?" + extra.slice(1) : ""), { method: "POST" });
    $("message").textContent = `已启动（${label}）…`;
    $("error").textContent = "";
    $("progress").style.width = "0%";
    await refreshStatus();
  } catch (e) {
    $("error").textContent = "启动失败：" + e.message;
  }
}

$("btn-download").onclick = () => { window.location = "/api/v1/export/file"; };
$("prev").onclick = () => loadPreview(page - 1);
$("next").onclick = () => loadPreview(page + 1);
$("size").onchange = () => loadPreview(1);
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter") loadPreview(1); });
$("q").addEventListener("search", () => loadPreview(1));
$("close").onclick = () => $("overlay").classList.remove("open");
$("overlay").onclick = (e) => { if (e.target === $("overlay")) $("overlay").classList.remove("open"); };
$("tbody").onclick = (e) => {
  const tr = e.target.closest("tr[data-id]");
  if (tr) openDetail(tr.dataset.id);
};

// ---------------------------------------------------------------- 启动
(async () => {
  const s = await refreshStatus();
  if (s && s.sizeBytes) await loadPreview(1);
})();
</script>
</body>
</html>
