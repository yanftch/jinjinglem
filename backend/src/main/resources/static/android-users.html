<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Android 用户 · 进京了</title><link rel="stylesheet" href="/member-admin.css"><link rel="stylesheet" href="/admin-embed.css"><script src="/admin-security.js" defer></script><script src="/android-users.js" defer></script></head><body>
<h1>Android 用户</h1><p class="hint">首次登记按设备标识只创建一位用户；此后启动更新最近使用时间。VIP 变更立即生效，路线规划由服务端逐次核验。</p>
<div class="panel detail-grid" id="overview"><div>累计用户：<strong id="allUsers">—</strong></div><div>今日新增：<strong id="newToday">—</strong></div><div>有效 VIP：<strong id="activeVip">—</strong></div></div>
<div class="toolbar"><input id="search" placeholder="用户编号、设备标识、厂商或型号"><button id="searchButton">搜索</button><a href="/manage.html?page=android-user-history">查看操作历史</a></div>
<div class="panel"><table><thead><tr><th>用户编号</th><th>设备标识</th><th>厂商 / 品牌</th><th>手机型号</th><th>Android</th><th>VIP 状态</th><th>到期时间</th><th>首次登记</th><th>最近使用</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><div class="pager"><button id="previous">上一页</button><span id="paging"></span><button id="next">下一页</button></div></div>
<div class="panel" id="detail" hidden><h2>设置 VIP 身份</h2><div id="summary" class="detail-grid"></div><div class="form-row"><label>有效期<select id="plan"><option value="MONTH">1 个月（30 天）</option><option value="YEAR">1 年（365 天）</option><option value="CUSTOM">指定到期时间</option><option value="NONE">取消 VIP</option></select></label><label id="customExpiryWrap" hidden>到期时间<input id="customExpiry" type="datetime-local"></label><label>操作原因<input id="reason" maxlength="500" placeholder="必填，供留痕查询"></label></div><p class="hint">月/年套餐从当前时间起计算；指定时间须在未来 10 年内。每次保存覆盖此前到期时间。</p><div class="actions"><button id="save" class="primary">保存 VIP 身份</button><span id="message"></span></div></div>
<div class="panel"><h2>客服微信二维码</h2><p class="hint">此上传接口保留供其他客户端使用；当前 Android App 已内置“品牌设计”目录的二维码，更新此处不会改变已安装 App 的图片。</p><div class="form-row"><input id="qrFile" type="file" accept="image/png,image/jpeg" aria-label="选择微信二维码图片"><button id="uploadQr">上传二维码</button><span id="qrMessage"></span></div><img id="qrPreview" alt="当前客服微信二维码" style="display:none;max-width:240px;max-height:240px;margin-top:16px"></div>
</body></html>
