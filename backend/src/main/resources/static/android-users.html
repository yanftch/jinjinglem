<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Android 用户 · 进京了</title><link rel="stylesheet" href="/member-admin.css"><link rel="stylesheet" href="/admin-embed.css"><script src="/admin-security.js" defer></script><script src="/android-users.js" defer></script></head><body>
<h1>Android 用户</h1><p class="hint">App 首次启动会自动登记设备。管理员可按月或按年设置会员有效期；变更立即生效，路线规划每次由服务端重新核验。</p>
<div class="toolbar"><input id="search" placeholder="用户编号或设备标识"><button id="searchButton">搜索</button><a href="/manage.html?page=android-user-history">查看操作历史</a></div>
<div class="panel"><table><thead><tr><th>用户编号</th><th>设备标识</th><th>会员状态</th><th>有效期至</th><th>首次登记</th><th>最近启动</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><div class="pager"><button id="previous">上一页</button><span id="paging"></span><button id="next">下一页</button></div></div>
<div class="panel" id="detail" hidden><h2>设置会员身份</h2><div id="summary" class="detail-grid"></div><div class="form-row"><label>有效期<select id="plan"><option value="MONTH">1 个月（30 天）</option><option value="YEAR">1 年（365 天）</option><option value="NONE">取消会员</option></select></label><label>操作原因<input id="reason" maxlength="500" placeholder="必填，供留痕查询"></label></div><p class="hint">保存后从当前时间起计算新的到期时间；再次设置会覆盖此前到期时间。</p><div class="actions"><button id="save" class="primary">保存会员身份</button><span id="message"></span></div></div>
<div class="panel"><h2>客服微信二维码</h2><p class="hint">上传后，Android 的“联系客服”和“开通会员”页面会自动加载。图片保存在数据库中，更新 App 无需重新上传。</p><div class="form-row"><input id="qrFile" type="file" accept="image/png,image/jpeg" aria-label="选择微信二维码图片"><button id="uploadQr">上传二维码</button><span id="qrMessage"></span></div><img id="qrPreview" alt="当前客服微信二维码" style="display:none;max-width:240px;max-height:240px;margin-top:16px"></div>
</body></html>
