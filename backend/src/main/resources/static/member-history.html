<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会员操作历史 · 进京了</title><link rel="stylesheet" href="/member-admin.css"><link rel="stylesheet" href="/admin-embed.css"><script src="/admin-security.js" defer></script><script src="/beijing-time.js" defer></script><script src="/member-history.js" defer></script></head><body><h1>会员操作历史</h1><p class="hint">仅记录管理员写入操作，按时间倒序排列；支付平台事件单独留存。</p><div class="toolbar"><input id="memberQuery" placeholder="顺序编号或会员编号"><input id="orderId" type="number" placeholder="订单编号"><select id="action"><option value="">全部操作</option><option value="GRANT">补发</option><option value="SET_EXPIRY">调整到期</option><option value="REVOKE">撤销</option><option value="UNKNOWN">无效操作</option></select><select id="outcome"><option value="">全部结果</option><option value="SUCCESS">成功</option><option value="FAILED">失败</option></select><label>从<input id="from" type="datetime-local"></label><label>至<input id="to" type="datetime-local"></label><button id="searchButton">筛选</button></div><div class="panel"><table><thead><tr><th>时间</th><th>操作人</th><th>会员顺序编号</th><th>会员编号</th><th>订单</th><th>类型</th><th>结果</th><th>原因</th><th>详情</th></tr></thead><tbody id="rows"></tbody></table><div class="pager"><button id="previous">上一页</button><span id="paging"></span><button id="next">下一页</button></div></div><div id="detail" class="panel" hidden><h2>操作详情</h2><div id="meta"></div><div class="history-details"><div><h3>变更前</h3><pre id="before"></pre></div><div><h3>变更后</h3><pre id="after"></pre></div></div><p id="error" class="error"></p></div></body></html>
