<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会员管理 · 进京了</title><link rel="stylesheet" href="/member-admin.css"><link rel="stylesheet" href="/admin-embed.css"><script src="/admin-security.js" defer></script><script src="/members.js" defer></script></head><body>
<h1>会员管理</h1><p class="hint">会员编号是小程序“会员服务/联系客服”展示的数字编号，可复制后用于查询。补发、调整或撤销都必须填写原因，并记录在独立操作历史中。</p>
<div class="toolbar"><input id="search" placeholder="会员编号或微信 OpenID"><button id="searchButton">搜索</button></div>
<div class="panel"><table><thead><tr><th>小程序会员编号</th><th>微信 OpenID</th><th>试用到期</th><th>会员到期</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="memberRows"></tbody></table><div class="pager"><button id="previous">上一页</button><span id="paging"></span><button id="next">下一页</button></div></div>
<div class="panel"><h2>订单查询</h2><div class="toolbar"><input id="orderMember" type="number" placeholder="会员编号"><input id="orderNo" placeholder="完整订单号"><button id="orderSearch">搜索订单</button></div><table><thead><tr><th>订单编号</th><th>业务订单号</th><th>会员</th><th>套餐</th><th>金额</th><th>状态</th><th>创建时间</th></tr></thead><tbody id="allOrderRows"></tbody></table><div class="pager"><button id="orderPrevious">上一页</button><span id="orderPaging"></span><button id="orderNext">下一页</button></div></div>
<div id="detail" class="panel" hidden><h2>会员详情</h2><div id="summary" class="detail-grid"></div><h3>人工调整</h3><div class="form-row"><label>操作<select id="action"><option value="GRANT">补发会员天数</option><option value="SET_EXPIRY">调整到期时间</option><option value="REVOKE">撤销人工权益</option></select></label><label>补发天数<input id="days" type="number" min="1" max="3650"></label><label>到期时间<input id="expiry" type="datetime-local"></label><label>权益编号<input id="entitlementId" type="number" min="1"></label><label>关联订单编号（可选）<input id="relatedOrderId" type="number" min="1"></label><label>操作原因<input id="reason" maxlength="500" required></label></div><div class="actions"><button id="submit" class="primary">确认操作</button><span id="message"></span></div><h3>权益记录</h3><table><thead><tr><th>编号</th><th>来源</th><th>天数 / 指定到期</th><th>原因</th><th>撤销时间</th></tr></thead><tbody id="entitlementRows"></tbody></table><h3>该会员订单</h3><table><thead><tr><th>订单编号</th><th>订单号</th><th>套餐</th><th>金额</th><th>状态</th><th>创建时间</th></tr></thead><tbody id="orderRows"></tbody></table></div>
</body></html>
