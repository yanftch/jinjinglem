<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>小程序模式配置 · 进京了</title>
  <link rel="stylesheet" href="/member-admin.css">
  <link rel="stylesheet" href="/admin-embed.css">
  <script src="/admin-security.js" defer></script>
  <script src="/beijing-time.js" defer></script><script src="/miniprogram-mode.js" defer></script>
</head>
<body>
  <h1>小程序模式配置</h1>
  <p class="hint">配置对所有小程序用户统一生效。切换后，用户下次启动或从后台进入小程序时获取新模式。</p>
  <div class="panel">
    <h2>当前模式：<span id="currentMode">加载中</span></h2>
    <p class="hint">实际模式展示探头地图和最近新增弹窗；提审模式进入独立的行程足迹页，可定位并记录到达地点。网页和 Android 的探头数据不受此开关影响。</p>
    <div class="form-row"><label>小程序模式
      <select id="mode" disabled><option value="LIVE">实际模式</option><option value="REVIEW">提审模式</option></select>
    </label></div>
    <div class="actions"><button id="saveMode" class="primary" disabled>保存配置</button><span id="modeMessage"></span></div>
    <p class="muted">上次修改：<span id="updatedAt">—</span> · 操作人：<span id="updatedBy">—</span></p>
  </div>
  <div class="panel">
    <h2>到达记录</h2>
    <p class="hint">提审模式下，用户在足迹页点击记录按钮后，以 GCJ-02 坐标和当前小程序账号写入独立记录表。</p>
    <table><thead><tr><th>记录编号</th><th>用户编号</th><th>经度</th><th>纬度</th><th>定位精度（米）</th><th>记录时间</th></tr></thead><tbody id="arrivalRows"></tbody></table>
    <div class="pager"><button id="previous">上一页</button><span id="arrivalPaging">—</span><button id="next">下一页</button></div>
  </div>
  <div class="panel">
    <h2>模式变更记录</h2>
    <table><thead><tr><th>时间</th><th>原模式</th><th>新模式</th><th>操作人</th><th>来源 IP</th></tr></thead><tbody id="historyRows"></tbody></table>
  </div>
</body>
</html>
