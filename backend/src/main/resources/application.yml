spring:
  config:
    import:
      - optional:file:./deploy/.env[.properties]
      - optional:file:../deploy/.env[.properties]
  application:
    name: jinjing2
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jinjing2}
    username: ${DB_USER:jinjing2}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  flyway:
    enabled: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: ${APP_SESSION_COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  auth-enabled: ${APP_AUTH_ENABLED:true}
  admin-user: ${APP_ADMIN_USER:adsmaxa}
  admin-password: ${APP_ADMIN_PASSWORD:}
  import-directory: ${APP_IMPORT_DIRECTORY:./data/imports}
  amap-js-key: ${AMAP_JS_KEY:}
  amap-security-js-code: ${AMAP_SECURITY_JS_CODE:}
  amap-web-service-key: ${AMAP_WEB_SERVICE_KEY:}
  amap-route-url: ${AMAP_ROUTE_URL:https://restapi.amap.com/v5/direction/driving}
  route-camera-radius-meters: ${APP_ROUTE_CAMERA_RADIUS_METERS:100}
  map-coordinate-system: ${MAP_COORDINATE_SYSTEM:UNKNOWN}
  sync-enabled: ${APP_SYNC_ENABLED:false}
  sync-cron: ${APP_SYNC_CRON:0 0 3 * * *}
  snapshot-directory: ${APP_SNAPSHOT_DIRECTORY:}
  mail-credentials-file: ${APP_MAIL_CREDENTIALS_FILE:}
  mail-from: ${APP_MAIL_FROM:}
  mail-auth-code: ${APP_MAIL_AUTH_CODE:}
  mail-to: ${APP_MAIL_TO:qiuyanfeng678@163.com}
  comment-report-enabled: ${APP_COMMENT_REPORT_ENABLED:false}
  comment-report-to: ${APP_COMMENT_REPORT_TO:qiuyanfeng678@163.com}
  camera-report-mail-enabled: ${APP_CAMERA_REPORT_MAIL_ENABLED:false}
  camera-report-mail-to: ${APP_CAMERA_REPORT_MAIL_TO:qiuyanfeng678@163.com}
  public-base-url: ${APP_PUBLIC_BASE_URL:}
  wechat-app-id: ${WECHAT_APP_ID:}
  wechat-app-secret: ${WECHAT_APP_SECRET:}
  virtual-pay-offer-id: ${WECHAT_VIRTUAL_PAY_OFFER_ID:}
  virtual-pay-app-key: ${WECHAT_VIRTUAL_PAY_APP_KEY:}
  virtual-pay-month-product-id: ${WECHAT_VIRTUAL_PAY_MONTH_PRODUCT_ID:}
  virtual-pay-year-product-id: ${WECHAT_VIRTUAL_PAY_YEAR_PRODUCT_ID:}
  virtual-pay-message-token: ${WECHAT_VIRTUAL_PAY_MESSAGE_TOKEN:}
  virtual-pay-message-aes-key: ${WECHAT_VIRTUAL_PAY_MESSAGE_AES_KEY:}
duomaomao:
  bearer-token: ${DUOMAOMAO_BEARER_TOKEN:}
  bearer-token-file: ${DUOMAOMAO_BEARER_TOKEN_FILE:}
  public-key-base64: ${DUOMAOMAO_PUBLIC_KEY:}
  export-file: ${APP_IMPORT_DIRECTORY:./data/imports}/duomaomao-current.json
  export-concurrency: ${DUOMAOMAO_EXPORT_CONCURRENCY:6}
  use-system-proxy: ${DUOMAOMAO_USE_SYSTEM_PROXY:false}
